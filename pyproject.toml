[build-system]
requires = ["setuptools==75.3.0"]
build-backend = "setuptools.build_meta"

[project]
name = "culture-study"
version = "0.1.0"
description = "Native cultural benchmark baseline and evidence-repair prelude"
requires-python = ">=3.10,<3.12"
dependencies = [
  "torch==2.5.1",
  "transformers==4.46.3",
  "accelerate==1.1.1",
  "huggingface-hub==0.26.2",
  "safetensors==0.4.5",
  "pandas==2.2.2",
  "numpy==1.24.3",
  "tqdm==4.66.4"
]

[tool.setuptools.packages.find]
include = ["culture_study*"]
